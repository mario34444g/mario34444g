<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Votaciones - TSE Auradon</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <script>
        function confirmarVoto() {
            const candidatoSeleccionado = document.querySelector('input[name="candidato"]:checked');
            if (!candidatoSeleccionado) {
                alert("Por favor, selecciona un candidato antes de continuar.");
                return;
            }
            const confirmacion = confirm(`Confirmas tu voto por ${candidatoSeleccionado.dataset.nombre}?`);
            if (confirmacion) {
                document.getElementById("formVotacion").submit();
            }
        }
    </script>
</head>
<body>
    <header>
        <h1>Votaciones - Tribunal Supremo Electoral de Auradon</h1>
    </header>
    <div class="container">
        <h2>Selecciona tu candidato</h2>
        <form id="formVotacion" action="procesar_voto.php" method="POST" target="_blank">
            <label>
                <input type="radio" name="candidato" value="Jorge Pérez" data-nombre="Jorge Pérez"> Jorge Pérez
            </label><br>
            <label>
                <input type="radio" name="candidato" value="Luisa Miranda" data-nombre="Luisa Miranda"> Luisa Miranda
            </label><br>
            <button type="button" class="vote-button" onclick="confirmarVoto()">🗳️ Confirmar Voto</button>
        </form>
    </div>
    <footer>
        <p>&copy; 2025 TSE - Tribunal Supremo Electoral de Auradon. Todos los derechos reservados.</p>
    </footer>
</body>
</html>
