<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Comprobante de Votación</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .comprobante {
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            padding: 30px;
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        .comprobante h1 {
            color: #007bff;
        }
        .comprobante p {
            margin: 15px 0;
        }
        .codigo-verificacion {
            background-color: #f0f0f0;
            padding: 10px;
            border-radius: 5px;
            font-weight: bold;
            margin-top: 20px;
        }
        .btn-descargar {
            display: inline-block;
            background-color: #28a745;
            color: white;
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 5px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="comprobante">
        <h1>✅ Voto Registrado</h1>
        <p>Tu voto ha sido registrado con éxito</p>
        
        <div class="codigo-verificacion">
            Código de Verificación: 
            <span id="codigoVerificacion"></span>
        </div>

        <a href="#" id="descargarComprobante" class="btn-descargar">Descargar Comprobante</a>
    </div>

    <script>
        // Generar código de verificación
        function generarCodigo() {
            return Math.random().toString(36).substring(2, 10).toUpperCase();
        }

        // Obtener parámetros de la URL
        function getParameterByName(name) {
            name = name.replace(/[\[\]]/g, '\\$&');
            var regex = new RegExp('[?&]' + name + '(=([^&#]*)|&|#|$)'),
                results = regex.exec(window.location.href);
            if (!results) return null;
            if (!results[2]) return '';
            return decodeURIComponent(results[2].replace(/\+/g, ' '));
        }

        // Cargar datos al iniciar
        window.onload = function() {
            const candidato = getParameterByName('candidato');
            const codigoVerificacion = generarCodigo();
            
            document.getElementById('codigoVerificacion').textContent = codigoVerificacion;

            // Preparar descarga de comprobante
            document.getElementById('descargarComprobante').addEventListener('click', function() {
                const comprobante = `COMPROBANTE DE VOTACIÓN

Candidato: ${candidato}
Fecha: ${new Date().toLocaleString()}
Código de Verificación: ${codigoVerificacion}

Tribunal Supremo Electoral de Auradon`;

                const blob = new Blob([comprobante], {type: 'text/plain'});
                const url = window.URL.createObjectURL(blob);
                
                const a = document.createElement('a');
                a.href = url;
                a.download = 'comprobante_votacion.txt';
                a.click();
                window.URL.revokeObjectURL(url);
            });
        };
    </script>
</body>
</html>
